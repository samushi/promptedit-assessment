name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # .env.example points at the Docker services (pgsql, redis); on the runner
    # Postgres is a service container on localhost. Tests use the sync queue
    # and array cache (phpunit.xml), so Redis isn't needed here.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 54329

    services:
      # Same credentials as .env.example; 54329 is the host port compose.yaml
      # forwards (FORWARD_DB_PORT). phpunit.xml selects promptedit_test.
      pgsql:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promptedit
          POSTGRES_USER: promptedit
          POSTGRES_PASSWORD: secret
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U promptedit -d promptedit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Create test database
        run: psql -h 127.0.0.1 -p 54329 -U promptedit -d promptedit -c 'CREATE DATABASE promptedit_test'
        env:
          PGPASSWORD: secret

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
