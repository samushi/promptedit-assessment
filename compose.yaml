# Local environment (Laravel Sail style): the app, Postgres, Redis, Horizon
# (queue worker) and the scheduler all run in Docker. See README "Running it".
#
# Host ports are chosen not to collide with other local projects; override
# them in .env (APP_PORT, FORWARD_DB_PORT, FORWARD_REDIS_PORT, VITE_PORT).
services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'promptedit/app:8.4'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5174}:${VITE_PORT:-5174}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            # Linux node_modules for the container, kept apart from the host's.
            - 'node-modules:/var/www/html/node_modules'
        networks:
            - promptedit
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Queue worker: runs SubmitGenerationJob, ProcessPixelforgeEventJob and
    # SyncGenerationJob from Redis. Dashboard at /horizon (operators only).
    horizon:
        image: 'promptedit/app:8.4'
        command: php artisan horizon
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - promptedit
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Runs the schedule every minute: pixelforge:reconcile (the safety net).
    scheduler:
        image: 'promptedit/app:8.4'
        command: php artisan schedule:work
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - promptedit
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    pgsql:
        image: 'postgres:17-alpine'
        ports:
            - '${FORWARD_DB_PORT:-54329}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-promptedit}'
            POSTGRES_USER: '${DB_USERNAME:-promptedit}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'promptedit-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - promptedit
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-q',
                    '-d',
                    '${DB_DATABASE:-promptedit}',
                    '-U',
                    '${DB_USERNAME:-promptedit}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-63790}:6379'
        volumes:
            - 'promptedit-redis:/data'
        networks:
            - promptedit
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    # Optional public URL for Pixelforge webhooks while developing:
    #   docker compose --profile tunnel up -d tunnel
    #   docker compose logs tunnel | grep trycloudflare.com
    tunnel:
        image: 'cloudflare/cloudflared:2026.6.0'
        profiles: ['tunnel']
        command: tunnel --no-autoupdate --url http://laravel.test:80
        networks:
            - promptedit
        depends_on:
            - laravel.test

networks:
    promptedit:
        driver: bridge

volumes:
    promptedit-pgsql:
        driver: local
    promptedit-redis:
        driver: local
    node-modules:
        driver: local
